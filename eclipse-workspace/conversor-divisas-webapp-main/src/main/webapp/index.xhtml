<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Conversor de Divisas</title>
</h:head>

<h:body style="background-color: #f4f4f9; font-family: Arial, sans-serif; padding: 20px;">

    <h:form id="formConversor">
        <p:panel header="Conversor de Divisas (USD / COP)" style="max-width: 500px; margin: 0 auto; top: 50px;">

            <h:panelGrid columns="2" cellpadding="5" style="width: 100%;">

                <p:outputLabel for="tipo" value="Tipo de Conversión:" />
                <p:selectOneMenu id="tipo" value="#{conversorBean.transaccion.tipoTransaccion}" required="true">
                    <f:selectItem itemLabel="Seleccione una opción" itemValue="" noSelectionOption="true" />
                    <f:selectItem itemLabel="Dólar (USD) a Peso (COP)" itemValue="USD_A_COP" />
                    <f:selectItem itemLabel="Peso (COP) a Dólar (USD)" itemValue="COP_A_USD" />
                </p:selectOneMenu>

                <p:outputLabel for="valor" value="Cantidad a convertir:" />
                <p:inputNumber id="valor" value="#{conversorBean.transaccion.valorIngresado}" 
                               decimalPlaces="2" required="true" placeholder="0.00" />

            </h:panelGrid>

            <br />
            <p:commandButton value="Calcular Conversión" 
                             action="#{conversorBean.realizarConversion}" 
                             update="resultadoPanel" 
                             icon="pi pi-money-bill" 
                             style="width: 100%;" />

            <br /><br />

            <h:panelGroup id="resultadoPanel" layout="block" style="text-align: center; margin-top: 10px;">
                <p:fieldset legend="Resultado" rendered="#{conversorBean.resultado > 0}">
                    <h:outputText value="Tasa utilizada (USD a COP): " style="font-weight: bold;"/>
                    <h:outputText value="#{conversorBean.transaccion.tasa}" style="color: #2c3e50;">
                        <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" />
                    </h:outputText>
                    <br/><br/>
                    <h:outputText value="Total convertido: " style="font-weight: bold;"/>
                    <h:outputText value="#{conversorBean.resultado}" style="font-size: 1.5em; color: #2c3e50; font-weight: bold;">
                        <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" />
                    </h:outputText>
                </p:fieldset>
            </h:panelGroup>

        </p:panel>
    </h:form>

</h:body>
</html>
